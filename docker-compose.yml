version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: business-os-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: business_os
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: business-os-cache
    ports:
      - "6379:6379"

volumes:
  postgres_data:
